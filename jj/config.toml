#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Misael Aguayo"
email = "aguayo.misael@gmail.com"

# the Mac is the work machine
[[--scope]]
--when.platforms = ["macos"]
[--scope.user]
email = "maguayo@armlend.com"

[ui]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]
diff-formatter = "difft"
pager = "less -FRX"
merge-editor = "mergiraf"
conflict-marker-style = "git"

[merge-tools.difft]
diff-args = ["--color=always", "--display=side-by-side", "$left", "$right"]

[lazyjj]
# lazyjj ignores ui.diff-formatter, so point it at difftastic explicitly
diff-tool = "difft"

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks()"

[merge-tools.diffconflicts]
program = "nvim"
merge-args = ["-c", "DiffConflicts", "$output", "$base", "$left", "$right"]

[aliases]
# Find the closest ancestor with a bookmark pointing at it, and move it to the
# parent of the working copy.
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@"]
