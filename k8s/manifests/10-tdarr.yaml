apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: media
  labels:
    app: tdarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      containers:
        - name: tdarr
          image: ghcr.io/haveagitgat/tdarr:latest
          env:
            - name: TZ
              value: Etc/UTC
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK_SET
              value: "002"
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "true"
            - name: inContainer
              value: "true"
            - name: nodeName
              value: missileserv
          ports:
            - name: webui
              containerPort: 8265
            - name: server
              containerPort: 8266
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              # QuickSync via the Intel GPU device plugin (05-intel-gpu-plugin.yaml)
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: server
              mountPath: /app/server
            - name: configs
              mountPath: /app/configs
            - name: logs
              mountPath: /app/logs
            - name: transcode-cache
              mountPath: /temp
            - name: media
              mountPath: /media
      volumes:
        - name: server
          hostPath:
            path: /var/lib/tdarr/server
            type: DirectoryOrCreate
        - name: configs
          hostPath:
            path: /var/lib/tdarr/configs
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /var/lib/tdarr/logs
            type: DirectoryOrCreate
        - name: transcode-cache
          hostPath:
            path: /var/lib/tdarr/transcode-cache
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: /mnt/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: tdarr
  namespace: media
spec:
  type: NodePort
  selector:
    app: tdarr
  ports:
    - name: webui
      port: 8265
      targetPort: 8265
      nodePort: 30265
    - name: server
      port: 8266
      targetPort: 8266
      nodePort: 30266
